# Registre des sources pour le chantier collecte.
#
# doc_config decrit la TOPOLOGIE de la documentation par rapport au site :
#   sous_domaine   -> doc sur un sous-domaine du meme domaine que site
#   domaine_separe -> doc sur un domaine registrable different de site
#   integre        -> doc sur un chemin (doc_prefixe) du domaine de site
#   absente        -> pas de centre de documentation public identifie
#   a_verifier     -> non confirme, ne pas crawler avant resolution
#
# doc_collecte decrit la COLLECTABILITE technique (orthogonal a doc_config) :
#   standard     -> crawl HTML/sitemap classique
#   spa_onglets  -> contenu charge en JS sur une URL unique, crawl HTML insuffisant
#   a_verifier   -> non teste

- nom: tolteck
  site: https://www.tolteck.com/
  doc: https://help.tolteck.com/fr/
  doc_config: sous_domaine
  doc_prefixe: null
  doc_collecte: standard
  aide_fait: false
  marketing_fait: false

- nom: progbat
  site: https://www.progbat.com/
  doc: https://docv5.progbat.com/
  doc_config: sous_domaine
  doc_prefixe: null
  doc_collecte: standard
  aide_fait: false
  marketing_fait: false

- nom: batikko
  site: https://batikko.com/
  doc: https://batikko.com/documentation
  doc_config: integre
  doc_prefixe: /documentation
  doc_collecte: standard
  aide_fait: false
  marketing_fait: false
  note: "www.batikko.com redirige (301) vers batikko.com : domaine canonique sans www."

- nom: leobati
  site: https://www.leobati.fr/
  doc: https://www.leobati.fr/bati/guide
  doc_config: integre
  doc_prefixe: /bati/guide
  doc_collecte: spa_onglets
  aide_fait: false
  marketing_fait: false
  note: "guide en onglets JS sur URL unique ; crawl HTML insuffisant ; mecanisme d'impression/PDF a investiguer"

