- nom: inter-fast
  site: https://inter-fast.fr/
  doc: https://help.inter-fast.co/fr/
  doc_config: domaine_separe
  doc_prefixe: null
  doc_collecte: standard
  aide_fait: true
  marketing_fait: false
  note: "doc hebergee sur un domaine distinct (.co) du site principal (.fr), pas un sous-domaine ; sans incidence, centre_aide deja collecte"

- nom: openfire
  site: https://openfire.fr/
  doc: https://support.openfire.fr/hc/fr
  doc_config: sous_domaine
  doc_prefixe: null
  doc_collecte: standard
  aide_fait: true
  marketing_fait: false
  note: "URL documentaire canonique du corpus deja collecte (127 articles, Zendesk). Un second sous-domaine documentation.openfire.fr existe (plateforme distincte, sitemap propre, page d'accueil 'Home | OpenFire'), non reflete dans le corpus aide_fait=true."
  sources_secondaires:
    - id: documentation_2
      doc: https://documentation.openfire.fr/
      doc_config: sous_domaine
      dest: documentation_2
      doc_collecte: standard
      note: "Seconde documentation openfire, plateforme Odoo distincte du corpus Zendesk existant (centre_aide/, aide_fait=true). Verifie le 06/09/2026 : robots.txt standard, sitemap de 214 URLs, 54 liens internes reels dans le HTML de la page d'accueil, aucun marqueur de rendu JS bloquant. Ne remplace pas et ne fusionne pas avec centre_aide/ : les deux corpus restent separes jusqu'a arbitrage. Collecte dans sources/openfire/documentation_2/."

- nom: sellsy
  site: https://go.sellsy.com/
  doc: https://help.sellsy.com/fr/
  doc_config: sous_domaine
  doc_prefixe: null
  doc_collecte: standard
  aide_fait: true
  marketing_fait: false
  note: "www.sellsy.com redirige en 301 vers go.sellsy.com, destination declaree le 06/09/2026 apres verification (robots.txt standard, sitemap declare, 145 liens internes dans le HTML servi)"

- nom: vertuoza
  site: https://www.vertuoza.com/fr-fr
  doc: https://intercom-help.eu/vertuoza/fr/
  doc_config: domaine_separe
  doc_prefixe: null
  doc_collecte: standard
  aide_fait: true
  marketing_fait: false
  note: "doc hebergee sur une plateforme tierce (intercom-help.eu), pas un sous-domaine de vertuoza.com ; sans incidence, centre_aide deja collecte"

- nom: extrabat
  site: https://www.extrabat.com/
  doc: https://servicescompris.extrabat.com/
  doc_config: sous_domaine
  doc_prefixe: null
  doc_collecte: standard
  aide_fait: false
  marketing_fait: false
  note: "extrabat.com (sans www) redirige en 301 vers www.extrabat.com, domaine canonique. Aucune ligne Sitemap: declaree dans le robots.txt de servicescompris.extrabat.com, alors qu'un sitemap_index.xml existe bien sur le serveur (200, WordPress) : collecte.py ne le decouvrira pas via robots.txt et basculera automatiquement en crawl de secours profondeur 4, meme mecanisme que tolteck. Verification manuelle du 09/09/2026 : robots.txt 200 standard, 62 hrefs internes / 40 chemins distincts dans le HTML brut de l'accueil documentaire, aucun marqueur de rendu JS bloquant (_next, __NUXT__, __NEXT_DATA__, conteneur vide), pas de bascule cross-domaine."

- nom: obat
  site: https://www.obat.fr/
  doc: https://aide.obat.fr/
  doc_config: sous_domaine
  doc_prefixe: null
  doc_collecte: standard
  aide_fait: false
  marketing_fait: false
  note: "obat.fr redirige en 302 vers www.obat.fr, domaine canonique. Aucune ligne Sitemap: declaree dans le robots.txt de aide.obat.fr, alors qu'un sitemap.xml existe bien sur le serveur (200, XML). Pour la cible concernee par cette absence de declaration, verifier lors du run que collecte.py bascule effectivement sur son crawl de secours profondeur 4 ; ne pas extrapoler ce comportement a l'autre host. Verification manuelle du 09/09/2026 : robots.txt 200, plateforme HubSpot detectee (scripts hs-*) mais contenu HTML statique servi normalement, aucun rendu client bloquant, aucun marqueur SPA, pas de bascule cross-domaine. Trois sous-domaines identifies le 09/09/2026 et NON COLLECTES : travaux.obat.fr, education.obat.fr, partenariats.obat.fr. Hors perimetre declare (site + doc uniquement), jamais atteints par le crawl puisque hosts_for() limite la portee au host declare. Nature du contenu non verifiee. Cas comparable a openfire : un editeur peut porter plusieurs proprietes documentaires ou editoriales distinctes. Titres de page d'accueil constates le 09/09/2026 (HTTP 200 chacun) : travaux.obat.fr = 'Trouver un artisan qualifie pres de chez vous pour vos travaux | Obat' ; education.obat.fr = 'Obat - Education' ; partenariats.obat.fr = 'Devenez partenaires avec Obat !'. Nature reelle du contenu, volume et articulation avec le produit non etablis, aucun explore au-dela du titre."
