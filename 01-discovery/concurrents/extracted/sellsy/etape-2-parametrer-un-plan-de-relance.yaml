regles_operationnelles:
  - description_brute: les emails des relances automatiques doivent être rédigés au
                       préalable dans les emails personnalisés
    objet_concerne: email de relance
    condition: email rédigé au préalable depuis Réglages > Emails personnalisés
    consequence: l'email peut être sélectionné dans la relance
    preuve: {niveau: explicite, source: texte,
             citation: "doivent être rédigés au préalable depuis \"Menu\" > \"Réglages\" > \"Emails personnalisés\""}
    resolution_documentee: null

  - description_brute: un nombre minimum de jours entre les relances est paramétrable
    objet_concerne: plan de relance
    condition: paramétrage du plan
    consequence: les relances respectent un intervalle minimum
    preuve: {niveau: explicite, source: texte,
             citation: "mais aussi le nombre minimum de jours entre les relances"}
    resolution_documentee: null

  - description_brute: les relances des factures avec abonnement peuvent être activées ou
                       désactivées séparément
    objet_concerne: plan de relance des factures
    condition: option spécifique aux factures avec abonnement
    consequence: les relances de ces factures sont activées ou désactivées
    preuve: {niveau: explicite, source: texte,
             citation: "Activer ou désactiver les relances pour les factures avec abonnement"}
    resolution_documentee: null

signaux_emergents:
  - description_brute: Sellsy distingue plusieurs contacts chez un même client — contact
                       de relance, contact du document, contact principal, contact de
                       facturation — chacun pouvant recevoir la relance
    pourquoi_notable: le client n'est pas un interlocuteur unique mais un ensemble de
                      rôles distincts ; le schéma ne dispose que d'un destinataire par
                      interaction et de la valeur canonique « client », ce qui écrase
                      cette structure interne du côté client
    termes_source: ["contact de relance du client", "contact du document", "contact principal", "contact de facturation"]
    preuve: {niveau: explicite, source: texte,
             citation: "entre le contact de relance du client, le contact du document"}
