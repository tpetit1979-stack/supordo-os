parcours:
  origine: interne
  nature: administratif

interactions:
  - acteur:
      role_brut: null
      role_canonique: inconnu
      preuve: {niveau: inconnu, source: autre, citation: null}
    destinataire:
      role_brut: expert-comptable
      role_canonique: comptabilite
      preuve: {niveau: explicite, source: texte,
               citation: "Vous pouvez donner un accès à votre compte Sellsy à votre expert-comptable."}
    perimetre: partenaire
    relation: autre
    canal: email
    dans_logiciel: oui
    mecanismes:
      - forme: permission
        preuve: {niveau: explicite, source: texte,
                 citation: "Vous pouvez ensuite ajuster les privilèges de votre profil expert-comptable."}
      - forme: transmission
        preuve: {niveau: explicite, source: texte,
                 citation: "il recevra par la suite un email afin de se connecter à son accès"}
      - forme: edition_partagee
        preuve: {niveau: explicite, source: texte,
                 citation: "Voir et modifier vos factures"}

  - acteur:
      role_brut: Sellsy
      role_canonique: externe
      preuve: {niveau: explicite, source: texte,
               citation: "Une fois les informations validées par Sellsy"}
    destinataire:
      role_brut: expert-comptable
      role_canonique: comptabilite
      preuve: {niveau: explicite, source: texte,
               citation: "il recevra par la suite un email afin de se connecter"}
    perimetre: editeur
    relation: autre
    canal: email
    dans_logiciel: oui
    mecanismes:
      - forme: validation
        preuve: {niveau: explicite, source: texte,
                 citation: "Une fois les informations validées par Sellsy, il recevra par la suite un email"}

transitions_objet:
  - objet_source: informations de l'expert-comptable
    etat_entree: null
    action: soumettre la demande puis validation par Sellsy
    objet_resultat: accès expert-comptable
    etat_sortie: actif
    owner_avant: {role: inconnu, preuve: {niveau: inconnu, source: autre, citation: null}}
    owner_apres:
      role: expert-comptable
      preuve: {niveau: explicite, source: texte,
               citation: "il recevra par la suite un email afin de se connecter à son accès"}
    continuite:
      statut_observation: continue_documentee
      ruptures: []
    preuve: {niveau: explicite, source: texte,
             citation: "Renseignez les informations concernant votre expert-comptable puis cliquez"}

  - objet_source: accès expert-comptable existant
    etat_entree: actif
    action: supprimer l'accès pour pouvoir en créer un nouveau
    objet_resultat: nouvel accès expert-comptable
    etat_sortie: null
    owner_avant: {role: inconnu, preuve: {niveau: inconnu, source: autre, citation: null}}
    owner_apres: {role: inconnu, preuve: {niveau: inconnu, source: autre, citation: null}}
    continuite:
      statut_observation: non_determinable
      ruptures: []
    preuve: {niveau: explicite, source: texte,
             citation: "vous devrez d'abord supprimer l'accès existant"}

regles_operationnelles:
  - description_brute: l'accès expert-comptable est réservé à une personne externe et ne
                       peut pas être utilisé par un collaborateur de la société
    objet_concerne: accès expert-comptable
    condition: bénéficiaire externe à la société
    consequence: l'accès peut être ouvert ; un collaborateur interne ne peut pas l'utiliser
    preuve: {niveau: explicite, source: texte,
             citation: "l’accès expert-comptable est réservé à une personne externe"}
    resolution_documentee: null

  - description_brute: voir et modifier les achats, comptabiliser les documents et
                       exporter les données comptables supposent l'activation des modules
                       correspondants
    objet_concerne: privilèges de l'expert-comptable
    condition: module activé sur le compte
    consequence: les capacités correspondantes deviennent accessibles
    preuve: {niveau: explicite, source: texte,
             citation: "(le module doit être activé sur votre compte)"}
    resolution_documentee: null

  - description_brute: sans le droit « Accès aux fichiers », l'expert-comptable ne peut
                       pas télécharger les fichiers PDF
    objet_concerne: profil de privilèges
    condition: droit « Accès aux fichiers » non accordé
    consequence: le téléchargement des PDF échoue
    preuve: {niveau: explicite, source: texte,
             citation: "il sera nécessaire de lui donner le droit \"Accès aux fichiers\""}
    resolution_documentee:
      action: accorder le droit « Accès aux fichiers » dans la section Fonctionnalités
              diverses de son profil de privilèges
      acteur: null
      preuve: {niveau: explicite, source: texte,
               citation: "disponible dans la section \"Fonctionnalités diverses\" de son profil"}

  - description_brute: un changement d'expert-comptable impose de supprimer l'accès
                       existant avant d'en créer un nouveau
    objet_concerne: accès expert-comptable
    condition: un accès expert-comptable existe déjà
    consequence: aucun nouvel accès ne peut être créé avant suppression du précédent
    preuve: {niveau: explicite, source: texte,
             citation: "vous devrez d'abord supprimer l'accès existant"}
    resolution_documentee:
      action: supprimer l'accès existant depuis Réglages > Accès expert-comptable
      acteur: null
      preuve: {niveau: explicite, source: texte,
               citation: "depuis \"Menu\" > \"Réglages\" > \"Accès expert-comptable\""}

signaux_emergents: []
