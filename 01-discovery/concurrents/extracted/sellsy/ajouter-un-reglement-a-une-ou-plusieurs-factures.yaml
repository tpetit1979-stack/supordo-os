    etat_entree: null
    action: enregistrer un paiement depuis l'aperçu de la facture
    objet_resultat: règlement lié à la facture
    etat_sortie: null
    owner_avant: {role: inconnu, preuve: {niveau: inconnu, source: autre, citation: null}}
    owner_apres: {role: inconnu, preuve: {niveau: inconnu, source: autre, citation: null}}
    continuite:
      statut_observation: continue_documentee
      ruptures: []
    preuve: {niveau: explicite, source: texte,
             citation: "enregistrer les paiements reçus de vos clients en règlement de vos factures"}

  - objet_source: règlement non affecté
    etat_entree: non affecté
    action: rattacher au document
    objet_resultat: règlement lié
    etat_sortie: null
    owner_avant: {role: inconnu, preuve: {niveau: inconnu, source: autre, citation: null}}
    owner_apres: {role: inconnu, preuve: {niveau: inconnu, source: autre, citation: null}}
    continuite:
      statut_observation: continue_documentee
      ruptures: []
    preuve: {niveau: explicite, source: texte,
             citation: "ils vous sont proposés en haut de la fenêtre"}

  - objet_source: règlement enregistré depuis le menu Banque
    etat_entree: null
    action: solder des factures et répartir le montant
    objet_resultat: règlement lié à plusieurs factures
    etat_sortie: null
    owner_avant: {role: inconnu, preuve: {niveau: inconnu, source: autre, citation: null}}
    owner_apres: {role: inconnu, preuve: {niveau: inconnu, source: autre, citation: null}}
    continuite:
      statut_observation: continue_documentee
      ruptures: []
    preuve: {niveau: explicite, source: texte,
             citation: "spécifier le montant à solder pour chacune d'entre-elles"}

  - objet_source: paiement dont la date ou le montant est erroné
    etat_entree: enregistré
    action: supprimer puis recréer le paiement
    objet_resultat: paiement corrigé
    etat_sortie: null
    owner_avant: {role: inconnu, preuve: {niveau: inconnu, source: autre, citation: null}}
    owner_apres: {role: inconnu, preuve: {niveau: inconnu, source: autre, citation: null}}
    continuite:
      statut_observation: rupture_documentee
      ruptures:
        - type: ressaisie
          preuve: {niveau: explicite, source: texte,
                   citation: "le paiement devra être supprimé puis recréé avec les informations souhaitées"}
    preuve: {niveau: explicite, source: texte,
             citation: "la date et le montant d'un paiement enregistré (...) ne peuvent pas être modifiés"}

regles_operationnelles:
  - description_brute: par défaut le règlement solde la facture
    objet_concerne: règlement
    condition: case d'ajustement laissée cochée
    consequence: le règlement solde la facture
    preuve: {niveau: explicite, source: texte,
             citation: "Par défaut, le règlement solde la facture."}
    resolution_documentee:
      action: décocher la case d'ajustement pour saisir le montant exact d'un règlement partiel
      acteur: null
      preuve: {niveau: explicite, source: texte,
               citation: "décochez la case d'ajustement pour saisir le montant exact"}

  - description_brute: la date et le montant d'un paiement enregistré ne peuvent pas être
                       modifiés
    objet_concerne: paiement
    condition: paiement déjà enregistré sur un document
    consequence: aucune modification de la date ni du montant
    preuve: {niveau: explicite, source: texte,
             citation: "ne peuvent pas être modifiés, le paiement devra être supprimé puis recréé"}
    resolution_documentee:
      action: supprimer le paiement puis le recréer avec les informations souhaitées
      acteur: null
      preuve: {niveau: explicite, source: texte,
               citation: "supprimé puis recréé avec les informations souhaitées"}

  - description_brute: l'ajout de règlements et l'accès à la liste des règlements
                       supposent des droits dans le profil de privilèges
    objet_concerne: profil de privilèges
    condition: droits nécessaires accordés
    consequence: l'ajout de règlements et l'accès à la liste deviennent possibles
    preuve: {niveau: explicite, source: texte,
             citation: "vous devez avoir les droits nécessaires dans votre profil de privilèges"}
    resolution_documentee:
      action: prendre contact avec un administrateur du compte Sellsy
      acteur: administrateur
      preuve: {niveau: explicite, source: texte,
               citation: "veuillez prendre contact avec un administrateur de votre compte Sellsy"}

  - description_brute: la liste des règlements n'affiche que ceux des clients, prospects
                       et fournisseurs auxquels l'utilisateur a accès
    objet_concerne: liste des règlements
    condition: périmètre d'accès de l'utilisateur
    consequence: seuls les règlements des tiers accessibles sont affichés
    preuve: {niveau: explicite, source: texte,
             citation: "n'affichera que les règlements des clients/prospects/fournisseurs auxquels vous avez accès"}
    resolution_documentee: null

  - description_brute: pour des acomptes liés à un devis, la fonction « Émettre une
                       facture d'acompte » est plus adaptée
    objet_concerne: facture d'acompte
    condition: paiements échelonnés liés à un devis spécifique
    consequence: l'émission d'une facture d'acompte depuis le devis est recommandée
    preuve: {niveau: explicite, source: texte,
             citation: "Cette méthode est plus adaptée pour gérer les paiements échelonnés"}
    resolution_documentee: null

  - description_brute: plusieurs règlements remis en banque simultanément relèvent d'une
                       remise groupée
    objet_concerne: remise en banque
    condition: plusieurs règlements remis en banque en même temps
    consequence: la création d'une remise groupée est recommandée
    preuve: {niveau: explicite, source: texte,
             citation: "créez plutôt une remise groupée"}
    resolution_documentee: null

signaux_emergents:
  - description_brute: la liste des règlements est filtrée par le périmètre de tiers de
                       chaque utilisateur, de sorte que deux collaborateurs consultant le
                       même écran ne voient pas les mêmes encaissements
    pourquoi_notable: la réalité financière affichée dépend du rôle qui regarde ; le
                      schéma sait enregistrer qu'un accès est accordé ou refusé, pas qu'un
                      même écran restitue un contenu différent selon son lecteur
    termes_source: ["clients/prospects/fournisseurs auxquels vous avez accès"]
    preuve: {niveau: explicite, source: texte,
             citation: "la liste des règlements n'affichera que les règlements des clients"}
