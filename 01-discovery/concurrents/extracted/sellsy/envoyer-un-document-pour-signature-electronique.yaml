regles_operationnelles:
  - description_brute: l'envoi en signature électronique suppose le privilège « Création
                       de signature électronique »
    objet_concerne: profil de privilèges
    condition: privilège activé sur le profil collaborateur
    consequence: l'envoi en signature électronique est possible
    preuve: {niveau: explicite, source: texte,
             citation: "les profils de type collaborateur doivent avoir le privilège"}
    resolution_documentee:
      action: faire activer le privilège par un administrateur depuis Réglages >
              Profils de privilèges
      acteur: administrateur
      preuve: {niveau: explicite, source: texte,
               citation: "Les privilèges sont modifiables par les administrateurs"}

  - description_brute: le numéro de téléphone et l'email du destinataire sont obligatoires
    objet_concerne: demande de signature
    condition: destinataire renseigné avec téléphone et email
    consequence: les signataires peuvent être qualifiés en cas de litige
    preuve: {niveau: explicite, source: texte,
             citation: "Le numéro de téléphone (fixe ou mobile) et l'email du destinataire sont obligatoires"}
    resolution_documentee: null

  - description_brute: la signature électronique ne peut pas être activée sur un document
                       expiré
    objet_concerne: document de vente
    condition: document expiré
    consequence: l'activation de la signature électronique est impossible
    preuve: {niveau: explicite, source: texte,
             citation: "La signature électronique ne peut pas être activée sur un document expiré."}
    resolution_documentee:
      action: modifier le document pour ajuster la date du champ « à signer avant le »
      acteur: null
      preuve: {niveau: explicite, source: texte,
               citation: "ajuster la date dans le champ \"à signer avant le\""}

  - description_brute: une relance de signature ne peut pas être effectuée sur un document
                       expiré
    objet_concerne: demande de signature
    condition: document expiré
    consequence: la relance est impossible
    preuve: {niveau: explicite, source: texte,
             citation: "Une relance de signature électronique ne peut pas être effectuée"}
    resolution_documentee:
      action: annuler la demande de signature, ajuster la date puis renouveler la demande
      acteur: null
      preuve: {niveau: explicite, source: texte,
               citation: "il est nécessaire d'annuler la demande de signature, modifier le document"}

  - description_brute: un document déjà signé n'est légalement plus modifiable
    objet_concerne: document de vente
    condition: document signé
    consequence: aucune modification n'est possible
    preuve: {niveau: explicite, source: texte,
             citation: "ce dernier ne sera légalement plus modifiable"}
    resolution_documentee: null

  - description_brute: l'email d'invitation à la signature n'apparaît pas dans les
                       messages envoyés du compte email connecté
    objet_concerne: email d'invitation
    condition: envoi d'une demande de signature
    consequence: l'email est consultable dans l'onglet Emails du document, non dans la
                 messagerie connectée
    preuve: {niveau: explicite, source: texte,
             citation: "ne sera pas visible dans le dossier \"Messages envoyés\" de votre compte email"}
    resolution_documentee: null

