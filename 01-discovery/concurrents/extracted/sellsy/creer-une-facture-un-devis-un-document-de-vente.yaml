parcours:
  origine: vente
  nature: inconnu

interactions:
  - acteur:
      role_brut: null
      role_canonique: inconnu
      preuve: {niveau: inconnu, source: autre, citation: null}
    destinataire:
      role_brut: client
      role_canonique: client
      preuve: {niveau: explicite, source: texte,
               citation: "Votre adresse ainsi que celle de votre client ont été définies."}
    perimetre: client
    relation: autre
    canal: email
    dans_logiciel: oui
    mecanismes:
      - forme: transmission
        preuve: {niveau: explicite, source: texte,
                 citation: "vous pouvez l'enregistrer (en brouillon) ou l'envoyer directement par email"}

transitions_objet:
  - objet_source: société et catalogue
    etat_entree: null
    action: créer un devis
    objet_resultat: devis
    etat_sortie: null
    owner_avant: {role: inconnu, preuve: {niveau: inconnu, source: autre, citation: null}}
    owner_apres: {role: inconnu, preuve: {niveau: inconnu, source: autre, citation: null}}
    continuite:
      statut_observation: continue_documentee
      ruptures: []
    preuve: {niveau: explicite, source: texte,
             citation: "Votre adresse ainsi que celle de votre client ont été définies."}

  - objet_source: devis
    etat_entree: null
    action: convertir en facture
    objet_resultat: facture
    etat_sortie: null
    owner_avant: {role: inconnu, preuve: {niveau: inconnu, source: autre, citation: null}}
    owner_apres: {role: inconnu, preuve: {niveau: inconnu, source: autre, citation: null}}
    continuite:
      statut_observation: continue_documentee
      ruptures: []
    preuve: {niveau: explicite, source: texte,
             citation: "afin que deux documents de vente soient liés entre eux"}

  - objet_source: document de vente existant
    etat_entree: null
    action: copier ce document
    objet_resultat: copie du document
    etat_sortie: null
    owner_avant: {role: inconnu, preuve: {niveau: inconnu, source: autre, citation: null}}
    owner_apres: {role: inconnu, preuve: {niveau: inconnu, source: autre, citation: null}}
    continuite:
      statut_observation: rupture_documentee
      ruptures:
        - type: reconstruction_contexte
          preuve: {niveau: explicite, source: texte,
                   citation: "la copie ne sera pas rattachée au cycle de vente du document d'origine"}
    preuve: {niveau: explicite, source: texte,
             citation: "la possibilité de dupliquer un document déjà existant"}

regles_operationnelles:
  - description_brute: le paramétrage du compte en amont conditionne la conformité des
                       documents édités
    objet_concerne: informations de la société
    condition: informations de l'entreprise à jour avant l'édition
    consequence: les documents édités sont conformes
    preuve: {niveau: explicite, source: texte,
             citation: "le paramétrage de votre compte en amont (...) est indispensable"}
    resolution_documentee: null

  - description_brute: deux documents de vente ne peuvent pas être liés après leur
                       création
    objet_concerne: document de vente
    condition: documents créés séparément
    consequence: aucun lien ne peut être établi a posteriori
    preuve: {niveau: explicite, source: texte,
             citation: "il n'est pas possible de lier deux documents de vente après leur création"}
    resolution_documentee:
      action: utiliser l'option « Convertir » depuis la page du document parent
      acteur: null
      preuve: {niveau: explicite, source: texte,
               citation: "veuillez utiliser l'option \"Convertir\" depuis la page du document parent"}

  - description_brute: une copie de document n'est pas rattachée au cycle de vente du
                       document d'origine
    objet_concerne: copie de document
    condition: duplication d'un document existant
    consequence: la copie perd le rattachement au cycle de vente d'origine
    preuve: {niveau: explicite, source: texte,
             citation: "en cas de duplication, la copie ne sera pas rattachée au cycle de vente"}
    resolution_documentee: null

  - description_brute: les colonnes d'un document peuvent être masquées mais leur ordre
                       est figé
    objet_concerne: document de vente
    condition: personnalisation de l'affichage des colonnes
    consequence: le masquage est possible, la réorganisation ne l'est pas
    preuve: {niveau: explicite, source: texte,
             citation: "l'ordre des colonnes dans un document est figé"}
    resolution_documentee: null

  - description_brute: les paramètres d'un document héritent des préférences générales
                       ou de celles du client
    objet_concerne: préférences du document
    condition: aucune modification au niveau du document
    consequence: les paramètres généraux ou ceux du client s'appliquent
    preuve: {niveau: explicite, source: texte,
             citation: "ces paramètres sont réglés d'après vos préférences générales"}
    resolution_documentee: null

signaux_emergents:
  - description_brute: le document porte un « contact interne » ou « référent en charge »,
                       rôle désigné sur le document lui-même
    pourquoi_notable: comme le champ « responsable » d'un avenant Vertuoza, un rôle est
                      attaché à l'objet sans être acteur ni destinataire d'une interaction
                      documentée ; le schéma n'a pas d'emplacement pour un rôle porté par
                      le document
    termes_source: ["contact interne", "référent en charge du devis"]
    preuve: {niveau: explicite, source: texte,
             citation: "définir le contact interne à votre société ou le référent en charge"}
