regles_operationnelles:
  - description_brute: un avoir doit toujours avoir un montant positif, les écritures
                       apparaissant au crédit
    objet_concerne: avoir
    condition: création d'un avoir
    consequence: le montant doit être positif, Sellsy équilibre les deux documents
    preuve: {niveau: explicite, source: texte,
             citation: "Un avoir doit toujours être positif."}
    resolution_documentee: null

  - description_brute: les options « Annuler par un avoir » et « Modifier par un avoir »
                       ne sont disponibles que sur des factures validées
    objet_concerne: facture
    condition: facture validée
    consequence: les deux options d'annulation par avoir deviennent disponibles
    preuve: {niveau: explicite, source: texte,
             citation: "Ces deux options sont disponibles uniquement sur des factures validées."}
    resolution_documentee: null

  - description_brute: un avoir finalisé ne peut pas être supprimé, la numérotation devant
                       rester continue et chronologique
    objet_concerne: avoir
    condition: avoir finalisé
    consequence: la suppression est impossible
    preuve: {niveau: explicite, source: texte,
             citation: "il ne sera pas possible de supprimer un avoir finalisé"}
    resolution_documentee:
      action: créer une facture du même montant sur le même client, puis relier l'avoir
              à cette facture
      acteur: null
      preuve: {niveau: explicite, source: texte,
               citation: "Créez une facture du même montant que l'avoir"}

  - description_brute: un avoir créé par « Annuler par un avoir » ou « Modifier par un
                       avoir » ne peut plus être délié de la facture
    objet_concerne: avoir
    condition: avoir issu de l'une de ces deux options
    consequence: le déliement est impossible
    preuve: {niveau: explicite, source: texte,
             citation: "il ne sera pas possible de délier l'avoir de la facture"}
    resolution_documentee: null

  - description_brute: les factures d'acompte ne peuvent être annulées que par des avoirs
                       créés depuis elles, sans rattachement a posteriori
    objet_concerne: facture d'acompte
    condition: annulation d'une facture d'acompte
    consequence: l'avoir doit être créé depuis la facture d'acompte, aucun rattachement
                 ultérieur n'est possible
    preuve: {niveau: explicite, source: texte,
             citation: "mais pas de lier des avoirs à postériori"}
    resolution_documentee: null

  - description_brute: un avoir d'acompte ne peut pas être délié d'une facture d'acompte
    objet_concerne: avoir d'acompte
    condition: avoir d'acompte lié à une facture d'acompte
    consequence: le déliement est impossible
    preuve: {niveau: explicite, source: texte,
             citation: "Un avoir d'acompte ne peut pas être délié d'une facture d'acompte."}
    resolution_documentee: null

  - description_brute: l'annulation d'une facture par un avoir n'annule pas les
                       prélèvements GoCardless déjà programmés
    objet_concerne: prélèvement GoCardless
    condition: facture annulée par un avoir avec prélèvements programmés
    consequence: les prélèvements restent programmés
    preuve: {niveau: explicite, source: texte,
             citation: "il faudra penser à annuler ces prélèvements"}
    resolution_documentee:
      action: annuler les prélèvements depuis l'onglet « Prélèvement GoCardless » de la facture
      acteur: null
      preuve: {niveau: explicite, source: texte,
               citation: "depuis l'onglet \"Prélèvement GoCardless\" de la facture"}

signaux_emergents:
  - description_brute: l'annulation d'une facture ne propage rien vers les prélèvements
                       programmés dans le système de paiement connecté ; la documentation
                       s'en remet à la mémoire de l'utilisateur
    pourquoi_notable: une conséquence financière réelle dans un système tiers dépend d'un
                      geste que rien ne rappelle ni ne déclenche ; la règle enregistre la
                      consigne, mais le schéma ne distingue pas une conséquence prise en
                      charge par le produit d'une conséquence confiée à la vigilance humaine
    termes_source: ["il faudra penser à annuler ces prélèvements", "GoCardless"]
    preuve: {niveau: explicite, source: texte,
             citation: "il faudra penser à annuler ces prélèvements depuis l'onglet"}
