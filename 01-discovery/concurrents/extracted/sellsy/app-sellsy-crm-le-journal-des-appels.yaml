transitions_objet:
  - objet_source: appel sortant passé depuis l'application
    etat_entree: null
    action: capture automatique à la fin de l'appel
    objet_resultat: entrée dans le fil d'activités
    etat_sortie: null
    owner_avant: {role: inconnu, preuve: {niveau: inconnu, source: autre, citation: null}}
    owner_apres: {role: inconnu, preuve: {niveau: inconnu, source: autre, citation: null}}
    continuite:
      statut_observation: continue_documentee
      ruptures: []
    preuve: {niveau: explicite, source: texte,
             citation: "remplit automatiquement les détails de votre appel (appel sortant, date, heure"}

  - objet_source: note dictée au microphone
    etat_entree: null
    action: conversion de la parole en texte
    objet_resultat: note de l'appel
    etat_sortie: null
    owner_avant: {role: inconnu, preuve: {niveau: inconnu, source: autre, citation: null}}
    owner_apres: {role: inconnu, preuve: {niveau: inconnu, source: autre, citation: null}}
    continuite:
      statut_observation: continue_documentee
      ruptures: []
    preuve: {niveau: explicite, source: texte,
             citation: "utiliser le microphone intégré à votre téléphone pour dicter la note"}

  - objet_source: appel enregistré
    etat_entree: enregistré
    action: donner suite à l'appel
    objet_resultat: tâche, événement, opportunité ou document de vente
    etat_sortie: null
    owner_avant: {role: inconnu, preuve: {niveau: inconnu, source: autre, citation: null}}
    owner_apres: {role: inconnu, preuve: {niveau: inconnu, source: autre, citation: null}}
    continuite:
      statut_observation: continue_documentee
      ruptures: []
    preuve: {niveau: explicite, source: texte,
             citation: "vous serez automatiquement invité à donner suite à cet appel"}

regles_operationnelles:
  - description_brute: l'enregistrement des appels sortants suppose le droit « Accès au
                       module » dans la section Suivi des appels
    objet_concerne: profil de privilèges
    condition: droit « Accès au module » accordé sur Suivi des appels
    consequence: la fonctionnalité devient utilisable
    preuve: {niveau: explicite, source: texte,
             citation: "les profils de type collaborateur doivent avoir le droit “Accès au module”"}
    resolution_documentee:
      action: faire modifier les privilèges par un administrateur depuis Réglages >
              Profils de privilèges
      acteur: administrateur
      preuve: {niveau: explicite, source: texte,
               citation: "Les privilèges sont modifiables par les administrateurs"}

  - description_brute: la fonctionnalité s'active au premier appel, ou plus tard depuis
                       les réglages
    objet_concerne: enregistrement des appels sortants
    condition: proposition d'activation ignorée au premier appel
    consequence: l'activation reste possible ultérieurement
    preuve: {niveau: explicite, source: texte,
             citation: "vous pouvez l'activer plus tard depuis les réglages"}
    resolution_documentee:
      action: cocher l'option « Ajout des appels sortants » dans les réglages
      acteur: null
      preuve: {niveau: explicite, source: texte,
               citation: "Il suffira alors de cocher l'option \"Ajout des appels sortants\"."}

  - description_brute: la création d'une activité de suivi après un appel n'est pas
                       obligatoire
    objet_concerne: activité de suivi
    condition: proposition affichée après l'enregistrement de l'appel
    consequence: la liste peut être fermée sans créer d'activité
    preuve: {niveau: explicite, source: texte,
             citation: "Vous n’êtes pas obligé de créer une activité liée après un appel."}
    resolution_documentee: null

signaux_emergents:
  - description_brute: la note d'appel se saisit à la voix, dictée au microphone du
                       téléphone puis convertie en texte, immédiatement après avoir
                       raccroché
    pourquoi_notable: le mode de capture est ici la parole plutôt que le clavier, dans un
                      moment précis où l'utilisateur n'a pas les mains libres pour écrire ;
                      la transition « note dictée → note » enregistre le résultat mais
                      perd entièrement le fait que l'entrée soit vocale et immédiate
    termes_source: ["synthèse vocale", "dicter la note et la convertir en texte"]
    preuve: {niveau: explicite, source: texte,
             citation: "utiliser la synthèse vocale pour résumer les points clé dans les notes"}
