parcours:
  origine: vente
  nature: inconnu

interactions:
  - acteur:
      role_brut: collaborateur
      role_canonique: bureau
      preuve: {niveau: explicite, source: permission,
               citation: "les profils de type collaborateur doivent avoir le droit “Accès au module”"}
    destinataire:
      role_brut: contact
      role_canonique: client
      preuve: {niveau: explicite, source: texte,
               citation: "recherchez votre contact et cliquez sur \"Appeler\""}
    perimetre: client
    relation: autre
    canal: inconnu
    dans_logiciel: partiel
    mecanismes: []

  - acteur:
      role_brut: administrateurs
      role_canonique: patron
      preuve: {niveau: explicite, source: texte,
               citation: "Les privilèges sont modifiables par les administrateurs"}
    destinataire:
      role_brut: collaborateur
      role_canonique: bureau
      preuve: {niveau: explicite, source: permission,
               citation: "les profils de type collaborateur doivent avoir le droit “Accès au module”"}
