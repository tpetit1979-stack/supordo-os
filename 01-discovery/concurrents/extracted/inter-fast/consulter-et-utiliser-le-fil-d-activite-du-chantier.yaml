parcours:
  origine: inconnu
  nature: installation

interactions:
  - acteur:
      role_brut: personnes ayant accès au chantier
      role_canonique: inconnu
      preuve: {niveau: explicite, source: texte,
               citation: "il permet à toutes les personnes ayant accès au chantier de communiquer"}
    destinataire:
      role_brut: technicien / membre de l'équipe
      role_canonique: terrain
      preuve: {niveau: explicite, source: texte,
               citation: "poser une question à un technicien"}
    perimetre: interne
    relation: inconnu
    canal: fil_activite
    dans_logiciel: oui
    mecanismes:
      - forme: transmission
        preuve: {niveau: explicite, source: texte,
                 citation: "Cela permet d'adresser clairement une demande à une personne précise."}
      - forme: visibilite
        preuve: {niveau: explicite, source: texte,
                 citation: "Le fil est accessible aux personnes ayant accès au chantier."}
      - forme: automatisation
        preuve: {niveau: explicite, source: texte,
                 citation: "lorsqu'une intervention est créée depuis le chantier, une activité est automatiquement ajoutée"}

  - acteur:
      role_brut: personnes ayant accès au chantier
      role_canonique: inconnu
      preuve: {niveau: explicite, source: texte,
               citation: "toutes les personnes ayant accès au chantier"}
    destinataire:
      role_brut: client
      role_canonique: client
      preuve: {niveau: explicite, source: texte,
               citation: "Le message est alors configuré pour être visible par le client."}
    perimetre: client
    relation: autre
    canal: fil_activite
    dans_logiciel: oui
    mecanismes:
      - forme: visibilite
        preuve: {niveau: explicite, source: texte,
                 citation: "vous pouvez choisir s'il s'agit d'un échange interne à l'équipe ou d'un message visible par le client"}

transitions_objet:
