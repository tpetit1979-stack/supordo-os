regles_operationnelles:
  - description_brute: un devis passé au statut Accepté est figé et ne doit plus être
                       modifié
    objet_concerne: devis
    condition: le devis est au statut Accepté
    consequence: il est figé pour garantir la traçabilité juridique et commerciale
    preuve: {niveau: explicite, source: texte,
             citation: "il est figé pour garantir la traçabilité juridique et commerciale"}
    resolution_documentee:
      action: créer un avenant, document annexe lié au devis initial
      acteur: null
      preuve: {niveau: explicite, source: texte,
               citation: "La solution ? Créer un Avenant."}

  - description_brute: la création d'un avenant suppose que le devis d'origine soit au
                       statut Accepté
    objet_concerne: avenant
    condition: devis d'origine au statut Accepté
    consequence: l'action « Créer un avenant » est disponible
    preuve: {niveau: explicite, source: texte,
             citation: "Rendez-vous sur le devis d'origine (qui doit être au statut Accepté)"}
    resolution_documentee: null

  - description_brute: les prix unitaires négatifs ne sont pas autorisés dans le nouvel
                       éditeur, conforme à la facturation électronique
    objet_concerne: ligne d'avenant
    condition: saisie d'une moins-value
    consequence: un prix unitaire négatif est refusé
    preuve: {niveau: explicite, source: texte,
             citation: "les prix unitaires négatifs ne sont pas autorisés"}
    resolution_documentee:
      action: saisir l'article avec un prix positif et une quantité négative
      acteur: null
      preuve: {niveau: explicite, source: texte,
               citation: "saisissez votre article avec un prix positif, mais indiquez une quantité négative"}

  - description_brute: un avenant n'est pris en compte dans la facturation finale que
                       s'il est au statut Accepté
    objet_concerne: avenant
    condition: avenant au statut Accepté
    consequence: il entre dans le calcul de la facturation finale
    preuve: {niveau: explicite, source: texte,
             citation: "doit impérativement être passé au statut \"Accepté\" pour être pris en compte"}
    resolution_documentee: null

  - description_brute: plusieurs avenants peuvent coexister et sont cumulés lors de la
                       facturation du solde
    objet_concerne: avenant
    condition: avenants au statut Accepté
    consequence: InterFast cumule l'ensemble des avenants acceptés
    preuve: {niveau: explicite, source: texte,
             citation: "InterFast cumulera l'ensemble des avenants ayant le statut \"Accepté\""}
    resolution_documentee: null

  - description_brute: si les acomptes versés dépassent le montant final des travaux,
                       la facture de solde est négative ou nulle
    objet_concerne: facture de solde
    condition: acomptes supérieurs au montant final après avenant en moins-value
    consequence: la facture de solde générée est négative ou à zéro
    preuve: {niveau: explicite, source: texte,
             citation: "la facture de solde générée sera négative (ce qui correspond techniquement à un avoir)"}
    resolution_documentee: null

signaux_emergents: []
