regles_operationnelles:
  - description_brute: le mode hors ligne est partiel, l'intervention doit avoir été
                       chargée au préalable avec une connexion active
    objet_concerne: intervention
    condition: intervention préchargée avec une connexion internet active
    consequence: le téléphone connaît le client et le travail à faire hors réseau
    preuve: {niveau: explicite, source: texte,
             citation: "Vous devez obligatoirement avoir chargé l'intervention au préalable"}
    resolution_documentee:
      action: ouvrir la fiche d'intervention et cliquer sur Démarrer l'intervention avant
              de perdre le réseau
      acteur: null
      preuve: {niveau: explicite, source: texte,
               citation: "Avant de perdre le réseau (...) ouvrez l'application InterFast"}

  - description_brute: il ne faut pas terminer l'intervention tant que le réseau n'est
                       pas revenu
    objet_concerne: intervention
    condition: absence de réseau au moment de terminer
    consequence: l'action « Terminer l'intervention » doit être différée
    preuve: {niveau: explicite, source: texte,
             citation: "ne cliquez pas tout de suite sur \"Terminer l'intervention\""}
    resolution_documentee:
      action: attendre une connexion stable puis terminer l'intervention
      acteur: null
      preuve: {niveau: explicite, source: texte,
               citation: "Attendez de retrouver une connexion stable (Wi-Fi ou 4G/5G)"}

signaux_emergents:
  - description_brute: la couverture du mode dégradé repose sur une discipline
                       d'anticipation du technicien — précharger depuis le véhicule avant
                       d'entrer dans la zone blanche, puis respecter un ordre d'actions
                       au retour du réseau
    pourquoi_notable: la continuité n'est pas assurée par le logiciel mais par un
                      protocole humain que la documentation enseigne ; le schéma ne
                      distingue pas une continuité tenue par le produit d'une continuité
                      tenue par le comportement de l'utilisateur
    termes_source: ["dans votre véhicule en arrivant devant le bâtiment", "mode hors ligne partiel"]
    preuve: {niveau: explicite, source: texte,
             citation: "Avant de perdre le réseau (par exemple, dans votre véhicule"}
