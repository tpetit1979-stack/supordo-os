  - description_brute: le client dispose d'un espace distinct où il consulte devis,
                       factures, documents de chantier, rapports et photos, mais jamais la
                       rentabilité, les prix d'achat ni le suivi de temps interne — et cet
                       accès est révocable
    pourquoi_notable: la frontière entre ce que voit l'entreprise et ce que voit le client
                      devient un espace applicatif à part entière, dont l'ouverture et la
                      fermeture sont des actes de gestion de la relation ; le schéma
                      représente le client comme un destinataire de documents, pas comme
                      un utilisateur doté d'un environnement propre
