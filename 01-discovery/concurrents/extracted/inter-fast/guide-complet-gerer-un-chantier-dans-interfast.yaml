  - description_brute: l'éditeur explique avoir délibérément laissé manuel le passage du
                       chantier au statut « En cours », au motif que l'ordre réel des
                       opérations dépend de l'organisation interne de chaque entreprise
    pourquoi_notable: c'est un refus assumé d'automatiser, justifié par la diversité des
                      organisations clientes ; le schéma enregistre l'absence de
                      propagation comme une rupture, sans pouvoir distinguer une lacune
                      d'un choix de conception explicitement motivé
    termes_source: ["Nous avons choisi de laisser cette étape manuelle", "selon votre propre organisation interne"]
