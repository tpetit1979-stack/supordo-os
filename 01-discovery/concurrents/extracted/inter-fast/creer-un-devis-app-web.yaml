regles_operationnelles:
  - description_brute: un devis au statut Brouillon n'a pas de numéro
    objet_concerne: devis
    condition: statut Brouillon
    consequence: aucun numéro n'est attribué au devis
    preuve: {niveau: explicite, source: texte,
             citation: "Tant que le statut du devis reste au statut Brouillon, le devis n'a pas de numéro."}
    resolution_documentee: null

  - description_brute: l'envoi pour signature exige un prénom et un nom renseignés sur
                       la fiche contact du client
    objet_concerne: contact CRM
    condition: prénom et nom renseignés dans le contact dédié
    consequence: l'envoi pour signature est possible
    preuve: {niveau: explicite, source: texte,
             citation: "Sans cela, l'envoi pour signature ne sera pas possible."}
    resolution_documentee:
      action: renseigner un prénom et un nom dans le contact de la fiche CRM
      acteur: null
      preuve: {niveau: explicite, source: texte,
               citation: "Attention à bien avoir renseigné un prénom et un nom dans le contact dédié"}

  - description_brute: l'acceptation via bon de commande suppose un devis au statut Envoyé
    objet_concerne: devis
    condition: devis au statut Envoyé
    consequence: l'acceptation via le bon de commande client est possible
    preuve: {niveau: explicite, source: texte,
             citation: "Votre devis doit être au statut « Envoyé » pour procéder via cette option."}
    resolution_documentee: null

  - description_brute: la distinction entre main d'œuvre et fourniture repose uniquement
                       sur l'unité choisie pour la ligne
    objet_concerne: ligne de devis
    condition: unité h, min ou mo
    consequence: la ligne est comptabilisée comme de la main d'œuvre, les autres unités
                 comme des fournitures
    preuve: {niveau: explicite, source: texte,
             citation: "la distinction main d'œuvre / fourniture est basée sur les unités"}
    resolution_documentee: null

  - description_brute: une signature déjà générée ne peut pas être modifiée directement
    objet_concerne: signature utilisateur
    condition: signature générée depuis les paramètres
    consequence: aucun bouton de modification directe n'existe
    preuve: {niveau: explicite, source: texte,
             citation: "il est nécessaire de d'abord la supprimer pour la recommencer"}
    resolution_documentee:
      action: supprimer la signature puis la recommencer
      acteur: null
      preuve: {niveau: explicite, source: texte,
               citation: "Vous pouvez la recommencer en cliquant sur \"Effacer la signature\"."}

  - description_brute: le sommaire n'affiche que les ouvrages et sous-ouvrages, sans le
                       détail des lignes
    objet_concerne: sommaire du devis
    condition: sommaire activé
    consequence: seuls ouvrages et sous-ouvrages apparaissent, avec leur montant total
    preuve: {niveau: explicite, source: texte,
             citation: "le sommaire affiche uniquement les ouvrages et sous-ouvrages"}
    resolution_documentee: null

  - description_brute: plusieurs devis ne peuvent pas être fusionnés ni rattachés à une
                       même maintenance ou un même chantier pour produire une seule facture
    objet_concerne: devis
    condition: plusieurs devis portant sur une même opération
    consequence: une facture unique ne peut pas être produite à partir de ces devis
    preuve: {niveau: explicite, source: texte,
             citation: "ne permet pas encore de fusionner automatiquement plusieurs devis"}
    resolution_documentee: null

  - description_brute: l'adresse de chantier peut être saisie à la main dans la
                       description du devis au lieu d'être rattachée à un chantier
    objet_concerne: devis
    condition: option « Inclure une description/page de garde » activée
    consequence: l'adresse du chantier figure dans la description au lieu d'un lien
                 vers un chantier
    preuve: {niveau: explicite, source: texte,
             citation: "possible d'ajouter les informations d'un chantier à la main"}
    resolution_documentee: null

signaux_emergents:
  - description_brute: la signature du rédacteur est apposée automatiquement sur le devis
                       et suit le changement de rédacteur, de sorte que le document porte
                       toujours l'identité du collaborateur qui l'a établi
    pourquoi_notable: l'identité d'un collaborateur est attachée au document et se
                      substitue automatiquement quand le rôle change de titulaire ; le
                      schéma représente qui agit et qui reçoit, jamais qui un document
                      engage
    termes_source: ["rédacteur de devis", "la validation du bon collaborateur"]
    preuve: {niveau: explicite, source: texte,
             citation: "Vos documents portent donc systématiquement la validation du bon collaborateur"}
