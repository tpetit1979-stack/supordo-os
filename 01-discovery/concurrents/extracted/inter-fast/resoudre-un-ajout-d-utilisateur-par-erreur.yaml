  - objet_source: profil utilisateur erroné
    etat_entree: null
    action: archiver puis créer un nouveau profil
    objet_resultat: nouveau profil utilisateur
    etat_sortie: null
    owner_avant: {role: inconnu, preuve: {niveau: inconnu, source: autre, citation: null}}
    owner_apres: {role: inconnu, preuve: {niveau: inconnu, source: autre, citation: null}}
    continuite:
      statut_observation: rupture_documentee
      ruptures:
        - type: reconstruction_contexte
          preuve: {niveau: explicite, source: texte,
                   citation: "puis créez un nouveau profil avec les bonnes informations"}
    preuve: {niveau: explicite, source: texte,
             citation: "Ne modifiez pas l’utilisateur existant si les informations sont incorrectes."}

regles_operationnelles:
  - description_brute: le coût d'une licence est généré dès son activation, même si
                       l'utilisateur est archivé immédiatement après
    objet_concerne: licence
    condition: licence activée
    consequence: le coût au prorata est facturé jusqu'à la prochaine échéance
    preuve: {niveau: explicite, source: texte,
             citation: "Ce coût est généré dès l'activation de la licence"}
    resolution_documentee: null

  - description_brute: les frais d'ajout de licence ne sont pas remboursables en numéraire
    objet_concerne: frais de licence
    condition: licence activée et montant réglé
    consequence: aucun remboursement sur le compte bancaire
    preuve: {niveau: explicite, source: texte,
             citation: "Les frais d'ajout de licence ne sont pas remboursables en numéraire."}
    resolution_documentee:
      action: archiver l'utilisateur pour convertir le montant en crédit, puis contacter
              le support pour valider la conversion
      acteur: support
      preuve: {niveau: explicite, source: texte,
               citation: "nous convertissons le montant facturé en crédit sur votre compte client"}

  - description_brute: un profil dont les informations sont incorrectes ne doit pas être
                       modifié
    objet_concerne: profil utilisateur
    condition: informations incorrectes sur un profil existant
    consequence: la modification est déconseillée
    preuve: {niveau: explicite, source: texte,
             citation: "Ne modifiez pas l’utilisateur existant si les informations sont incorrectes."}
    resolution_documentee:
      action: archiver le profil erroné puis créer un nouveau profil, le crédit couvrant
              la nouvelle facturation
      acteur: null
      preuve: {niveau: explicite, source: texte,
               citation: "Archivez le profil erroné, ce qui génère un crédit pour la somme avancée"}

  - description_brute: lors d'un remplacement de collaborateur, l'ordre des opérations
                       détermine le coût
    objet_concerne: licence
    condition: archivage du collaborateur sortant effectué avant l'invitation du nouveau
    consequence: la licence est libérée, le crédit couvre la nouvelle licence, l'opération
                 est neutre financièrement
    preuve: {niveau: explicite, source: texte,
             citation: "à condition de suivre le bon ordre : archivez d’abord le collaborateur sortant"}
    resolution_documentee: null

  - description_brute: la facture émise à tort reste comptablement valide et se trouve
                       neutralisée par l'avoir généré à l'archivage
    objet_concerne: facture d'abonnement
    condition: facture émise puis utilisateur archivé
    consequence: la facture reste valide, neutralisée par le crédit
    preuve: {niveau: explicite, source: texte,
             citation: "la facture émise reste comptablement valide"}
    resolution_documentee: null

  - description_brute: un archivage intervenant juste avant la date anniversaire n'empêche
                       pas la conservation du crédit
    objet_concerne: crédit d'abonnement
    condition: archivage peu avant la date anniversaire, facture de renouvellement déjà éditée
    consequence: le crédit reste sur le compte et sera déduit du paiement final ou de la
                 facture suivante
    preuve: {niveau: explicite, source: texte,
             citation: "le crédit généré reste sur votre compte"}
    resolution_documentee: null

signaux_emergents: []
