    destinataire:
      role_brut: client final
      role_canonique: client
      preuve: {niveau: explicite, source: texte,
               citation: "entre le gestionnaire et le client final"}
    perimetre: client
    relation: autre
    canal: email
    dans_logiciel: oui
    mecanismes:
      - forme: transmission
        preuve: {niveau: explicite, source: texte,
                 citation: "vous ne pourrez pas l’envoyer par mail au client final"}
      - forme: visibilite
        preuve: {niveau: explicite, source: texte,
                 citation: "Indiquez si c'est un avancement interne."}

