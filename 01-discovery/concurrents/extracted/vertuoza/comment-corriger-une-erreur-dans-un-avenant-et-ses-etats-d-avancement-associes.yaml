regles_operationnelles:
  - description_brute: les états d'avancement et factures liés ne peuvent être supprimés
                       que s'ils sont encore en Brouillon
    objet_concerne: état d'avancement / facture
    condition: les documents liés sont encore au statut Brouillon
    consequence: ils peuvent être supprimés
    preuve: {niveau: explicite, source: texte,
             citation: "Si les états d’avancement ou factures liés sont encore en Brouillon"}
    resolution_documentee: null

  - description_brute: corriger par un avenant négatif évite toute modification directe
                       du document initial
    objet_concerne: avenant
    condition: correction par création d'un avenant négatif puis d'un avenant correct
    consequence: l'historique reste clair et aucune modification directe n'est nécessaire
    preuve: {niveau: explicite, source: texte,
             citation: "d’éviter toute modification directe"}
    resolution_documentee:
      action: créer un avenant négatif annulant l'erreur, puis un avenant au montant correct
      acteur: null
      preuve: {niveau: explicite, source: texte,
               citation: "Créez un avenant avec un montant négatif pour annuler l'erreur"}

signaux_emergents:
  - description_brute: l'article n'énonce pas une procédure mais deux stratégies
                       concurrentes, et laisse explicitement l'arbitrage à l'utilisateur
                       selon qu'il privilégie la traçabilité ou une correction profonde
    pourquoi_notable: la documentation transmet un arbitrage plutôt qu'un mode opératoire ;
                      les transitions et les règles ne peuvent représenter que des chemins
                      certains, jamais un choix laissé ouvert entre deux chemins
                      incompatibles
    termes_source: ["deux approches possibles selon le contexte", "traçabilité", "correction approfondie"]
    preuve: {niveau: explicite, source: texte,
             citation: "selon vos besoins en traçabilité ou en correction approfondie"}
