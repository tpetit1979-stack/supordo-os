    - reouvrir
    - creer
  objets:
    - devis
    - chantier
    - facture
    - avenant
  job_to_be_done: modifier un devis deja transforme en chantier sans perdre les documents deja emis

coordination:
  niveau: 0
  justification: Aucun role ni transmission n'apparait ; l'article decrit une contrainte technique entre objets.
  niveau_infere: false
  de: null
  vers: null
  objet: null

resultat:
  objet_produit: devis reouvert ou avenant
  prochaine_etape: null

complexite:
  preconditions:
    - un devis valide et transforme en chantier existe
  nb_etapes: 2
  etats:
    - valide
  exceptions:
    - la suppression du chantier est impossible tant que des factures ou documents existent
    - si l'on ne veut pas supprimer ces documents, passer par un avenant
  systemes_externes: []

contexte:
  dispositif: null
  temporalite: apres
  recovery: true
  sortie_du_logiciel: []

preuve:
  statut: documented
  citation: "Le devis initial sera alors réouvert et à nouveau modifiable"
  champs_inferes:
    - metier.roles_canoniques
    - contexte.temporalite
  ambiguite: faible
  note: >-
    L'interet de l'article est une regle de dependance entre objets (devis / chantier /
    facture) qui contraint ce qui est encore reversible. Le schema n'a aucun champ pour
    representer une contrainte de ce type : ni preconditions ni exceptions ne rendent la
    logique "tant que X existe, Y est impossible".
