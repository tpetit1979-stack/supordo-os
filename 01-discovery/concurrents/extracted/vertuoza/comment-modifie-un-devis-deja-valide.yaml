  - description_brute: la suppression du chantier n'est possible que si aucun document
                       n'y a encore été créé
    objet_concerne: chantier
    condition: aucun document créé dans le chantier
    consequence: le chantier peut être supprimé et le devis réouvert
    preuve: {niveau: explicite, source: texte,
             citation: "si aucun document n’a encore été créé dans le chantier, supprimer celui-ci"}
    resolution_documentee: null

  - description_brute: tant que des factures ou autres documents existent dans le chantier,
                       celui-ci ne peut pas être supprimé
    objet_concerne: chantier
    condition: des factures ou autres documents ont été générés dans le chantier
    consequence: la suppression du chantier est impossible
    preuve: {niveau: explicite, source: texte,
             citation: "la suppression du chantier n’est plus possible tant que ces documents existent"}
    resolution_documentee:
      action: supprimer tous les documents associés, ou passer par un avenant pour
              modifier le devis sans les supprimer
      acteur: null
      preuve: {niveau: explicite, source: texte,
               citation: "Si vous supprimez tous les documents associés, le chantier pourra alors être supprimé."}

