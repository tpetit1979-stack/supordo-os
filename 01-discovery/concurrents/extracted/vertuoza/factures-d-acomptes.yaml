    etat_entree: null
    action: créer une facture d'acompte
    objet_resultat: facture d'acompte
    etat_sortie: brouillon
    owner_avant: {role: inconnu, preuve: {niveau: inconnu, source: autre, citation: null}}
    owner_apres: {role: inconnu, preuve: {niveau: inconnu, source: autre, citation: null}}
    continuite:
      statut_observation: non_determinable
      ruptures: []
    preuve: {niveau: explicite, source: texte,
             citation: "Cliquez sur \"Confirmer\", un brouillon de facture est donc créée."}

  - objet_source: facture d'acompte
    etat_entree: brouillon
    action: soumettre
    objet_resultat: facture d'acompte
    etat_sortie: à comptabiliser
    owner_avant: {role: inconnu, preuve: {niveau: inconnu, source: autre, citation: null}}
    owner_apres: {role: inconnu, preuve: {niveau: inconnu, source: autre, citation: null}}
    continuite:
      statut_observation: continue_documentee
      ruptures: []
    preuve: {niveau: explicite, source: texte,
             citation: "reprise dans le tableau des “Factures clients” sous le statut “à comptabiliser”"}

  - objet_source: facture d'acompte
    etat_entree: à comptabiliser
    action: comptabiliser
    objet_resultat: facture d'acompte numérotée
    etat_sortie: null
    owner_avant: {role: inconnu, preuve: {niveau: inconnu, source: autre, citation: null}}
    owner_apres: {role: inconnu, preuve: {niveau: inconnu, source: autre, citation: null}}
    continuite:
      statut_observation: continue_documentee
      ruptures: []
    preuve: {niveau: explicite, source: texte,
             citation: "cliquez sur Comptabiliser\" pour donner un numéro"}

  - objet_source: facture d'acompte
    etat_entree: null
    action: créditer la facture
    objet_resultat: note de crédit / avoir
    etat_sortie: null
    owner_avant: {role: inconnu, preuve: {niveau: inconnu, source: autre, citation: null}}
    owner_apres: {role: inconnu, preuve: {niveau: inconnu, source: autre, citation: null}}
    continuite:
      statut_observation: non_determinable
      ruptures: []
    preuve: {niveau: explicite, source: texte,
             citation: "cliquez sur \"Créditer la Facture\" pour créer une note de crédit/avoir"}

regles_operationnelles:
  - description_brute: une erreur sur une facture se corrige en créditant la facture,
                       ce qui crée une note de crédit ou un avoir
    objet_concerne: facture d'acompte
    condition: erreur constatée sur la facture
    consequence: la correction passe par une note de crédit / avoir
    preuve: {niveau: explicite, source: texte,
             citation: "En cas d'erreur sur la facture, cliquez sur “…” et ensuite sur \"Créditer la Facture\""}
    resolution_documentee:
      action: créer une note de crédit / avoir depuis la facture
      acteur: null
      preuve: {niveau: explicite, source: texte,
               citation: "pour créer une note de crédit/avoir"}

  - description_brute: une facture ne reçoit un numéro qu'au moment où elle est
                       comptabilisée
    objet_concerne: facture d'acompte
    condition: action Comptabiliser déclenchée
    consequence: un numéro est attribué à la facture
    preuve: {niveau: explicite, source: texte,
             citation: "sur Comptabiliser\" pour donner un numéro"}
    resolution_documentee: null

  - description_brute: le paiement se valide manuellement sur la facture lorsqu'il a
                       été effectué
    objet_concerne: facture d'acompte
    condition: le paiement a été fait
    consequence: le paiement peut être validé sur la facture
    preuve: {niveau: explicite, source: texte,
             citation: "sur \"Valider le Paiement\" si le paiement a été fait"}
    resolution_documentee: null

signaux_emergents:
  - description_brute: l'objectif affiché est de faire peser l'acompte sur la rentabilité
                       du chantier tout en tenant à jour un « restant à facturer »
    pourquoi_notable: un indicateur dérivé est maintenu en permanence à travers plusieurs
                      objets (chantier, factures successives) sans qu'aucun de ces objets
                      ne le porte ; ni les transitions ni les règles ne représentent un
                      état agrégé qui vit en dehors des documents
    termes_source: ["rentabilité du chantier", "restant à facturer"]
    preuve: {niveau: explicite, source: texte,
             citation: "impacter la rentabilité du chantier tout en restant à jour sur le restant à facturer"}
