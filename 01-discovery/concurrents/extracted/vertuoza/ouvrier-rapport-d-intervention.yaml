    owner_avant:
      role: ouvrier
      preuve: {niveau: explicite, source: texte,
               citation: "l'ouvrier peut également reprogrammer l'intervention"}
    owner_apres:
      role: gestion
      preuve: {niveau: explicite, source: texte,
               citation: "sera alors créée sur le planning côté gestion"}
    continuite:
      statut_observation: non_determinable
      ruptures: []
    preuve: {niveau: explicite, source: texte,
             citation: "en entrant la nouvelle date et les actions à réaliser"}

regles_operationnelles:
  - description_brute: dans une intervention en régie, chaque accompagnant ajouté est
                       repris dans les coûts de l'intervention
    objet_concerne: intervention
    condition: intervention en régie
    consequence: chaque accompagnant est ajouté dans les coûts de l'intervention
    preuve: {niveau: explicite, source: texte,
             citation: "chaque accompagnant est ajouté dans les coûts de l’intervention"}
    resolution_documentee: null

  - description_brute: dans une intervention en régie, la période saisie sert au calcul
                       du coût
    objet_concerne: intervention
    condition: intervention en régie
    consequence: la période indiquée sert à calculer le coût de l'intervention
    preuve: {niveau: explicite, source: texte,
             citation: "la période indiquée sert à calculer le coût de l’intervention"}
    resolution_documentee: null

  - description_brute: un élément du rapport n'apparaît sur la facture que si l'option
                       facturable est activée
    objet_concerne: ligne d'intervention
    condition: option "facturable" activée
    consequence: l'élément apparaît sur la facture
    preuve: {niveau: explicite, source: texte,
             citation: "L'élément apparaîtra sur la facture si l'option \"facturable\" est activée."}
    resolution_documentee: null

  - description_brute: une intervention marquée non facturable peut être assortie d'une
                       raison saisie par l'ouvrier
    objet_concerne: intervention
    condition: intervention marquée comme non facturable
    consequence: une raison peut être entrée
    preuve: {niveau: explicite, source: texte,
             citation: "Dans ce cas, il peut entrer une raison."}
    resolution_documentee: null

  - description_brute: une fois le rapport accepté, l'ouvrier ne peut plus le modifier
    objet_concerne: rapport d'intervention
    condition: le rapport est accepté
    consequence: l'ouvrier ne peut plus modifier le rapport
    preuve: {niveau: explicite, source: texte,
             citation: "Une fois accepté, l’ouvrier ne peut plus modifier le rapport."}
    resolution_documentee: null

signaux_emergents:
  - description_brute: c'est l'ouvrier, sur le terrain, qui décide de ce qui sera facturé
                       — caractère facturable, prix de l'intervention, prix unitaire de
                       la main-d'œuvre, coûts ajoutés — et sa saisie alimente directement
                       la facture
    pourquoi_notable: une décision à portée commerciale et financière est déléguée au
                      rôle terrain ; les règles enregistrent le mécanisme mais aucun champ
                      ne représente le fait que la décision elle-même change de rôle
    termes_source: ["facturable", "en régie", "forfaitaire", "prix unitaire"]
    preuve: {niveau: explicite, source: texte,
             citation: "L’ouvrier peut définir si la main-d’œuvre est facturable ou non"}

  - description_brute: le rapport comporte une liste d'« accompagnants », personnes
                       présentes sur l'intervention dont la seule trace est leur poids
                       dans les coûts
    pourquoi_notable: ces personnes participent au travail sans être ni acteur, ni
                      destinataire, ni utilisateur du logiciel ; le schéma n'a aucun
                      emplacement pour une personne qui n'a pas de compte mais compte
                      dans le calcul
    termes_source: ["accompagnants"]
    preuve: {niveau: explicite, source: texte,
             citation: "Dans cette section, l’ouvrier peut gérer la liste des accompagnants."}
