    owner_avant: {role: inconnu, preuve: {niveau: inconnu, source: autre, citation: null}}
    owner_apres:
      role: ouvrier
      preuve: {niveau: explicite, source: texte,
               citation: "Depuis le planning, l’ouvrier peut créer un rapport d’intervention."}
    continuite:
      statut_observation: non_determinable
      ruptures: []
    preuve: {niveau: explicite, source: texte,
             citation: "Depuis le planning, l’ouvrier peut créer un rapport d’intervention."}

  - objet_source: rapport d'intervention
    etat_entree: null
    action: soumettre puis accepter
    objet_resultat: rapport d'intervention
    etat_sortie: Clôturé
    owner_avant:
      role: ouvrier
      preuve: {niveau: explicite, source: texte,
               citation: "l’ouvrier peut le soumettre"}
    owner_apres: {role: inconnu, preuve: {niveau: inconnu, source: autre, citation: null}}
    continuite:
      statut_observation: continue_documentee
      ruptures: []
    preuve: {niveau: explicite, source: texte,
             citation: "le rapport apparaîtra sous le statut “Clôturé” dans la gestion de l’intervention"}

  - objet_source: intervention
