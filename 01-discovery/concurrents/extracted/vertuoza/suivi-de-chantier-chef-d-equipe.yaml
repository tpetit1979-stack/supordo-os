parcours:
  origine: inconnu
  nature: installation

interactions:
  - acteur:
      role_brut: ouvrier / chef d'équipe
      role_canonique: terrain
      preuve: {niveau: explicite, source: texte,
               citation: "L'ouvrier/chef d'équipe doit être programmé sur ce chantier au Planning"}
    destinataire:
      role_brut: gestionnaire
      role_canonique: bureau
      preuve: {niveau: explicite, source: texte,
               citation: "entre les équipes sur le terrain et les gestionnaires au bureau"}
    perimetre: interne
    relation: inconnu
    canal: interface
    dans_logiciel: oui
    mecanismes:
      - forme: transmission
        preuve: {niveau: explicite, source: texte,
                 citation: "communiquer sur le travail accompli via des remarques et des photos"}
      - forme: edition_partagee
        preuve: {niveau: explicite, source: texte,
                 citation: "Éditez le suivi si des modifications sont nécessaires."}
      - forme: visibilite
        preuve: {niveau: explicite, source: texte,
                 citation: "Pour le rendre visible aux gestionnaires, clôturez le suivi."}

transitions_objet:
  - objet_source: suivi de chantier
    etat_entree: soumis
    action: clôturer
    objet_resultat: suivi de chantier
    etat_sortie: clôturé
    owner_avant:
      role: ouvrier / chef d'équipe
      preuve: {niveau: contextuel, source: titre,
               citation: "Suivi de chantier chef d’équipe"}
    owner_apres:
      role: compte gestion
      preuve: {niveau: contextuel, source: texte,
               citation: "Visualisation, Édition et Clôture  (compte gestion)"}
    continuite:
      statut_observation: continue_documentee
      ruptures: []
    preuve: {niveau: explicite, source: texte,
             citation: "Retrouvez le suivi soumis dans la liste des 'Suivi de Chantiers'."}

regles_operationnelles:
  - description_brute: réaliser un suivi de chantier suppose de posséder un compte chantier
    objet_concerne: suivi de chantier
    condition: posséder un compte chantier
    consequence: le suivi de chantier peut être réalisé
    preuve: {niveau: explicite, source: texte,
             citation: "Posséder un compte chantier."}
    resolution_documentee: null

  - description_brute: l'ouvrier ou le chef d'équipe doit être programmé sur le chantier
                       au planning pour pouvoir en faire le suivi
    objet_concerne: suivi de chantier
    condition: être programmé sur ce chantier au Planning Vertuoza
    consequence: le suivi de chantier peut être réalisé
    preuve: {niveau: explicite, source: texte,
             citation: "doit être programmé sur ce chantier au Planning Vertuoza"}
    resolution_documentee: null

  - description_brute: le suivi chef d'équipe se réalise depuis le compte chantier sur mobile
    objet_concerne: suivi de chantier
    condition: être sur le compte chantier, sur mobile
    consequence: le suivi chef d'équipe peut être réalisé
    preuve: {niveau: explicite, source: texte,
             citation: "aller  sur votre compte chantier sur mobile"}
    resolution_documentee: null

  - description_brute: un suivi n'est visible des gestionnaires qu'une fois clôturé
    objet_concerne: suivi de chantier
    condition: le suivi est clôturé
    consequence: le suivi devient visible aux gestionnaires
    preuve: {niveau: explicite, source: texte,
             citation: "Pour le rendre visible aux gestionnaires, clôturez le suivi."}
    resolution_documentee: null

signaux_emergents:
  - description_brute: Vertuoza distingue deux types de comptes utilisateurs, le compte
                       chantier et le compte gestion, qui déterminent à la fois le rôle
                       tenu, l'appareil utilisé et les actions accessibles sur un même objet
    pourquoi_notable: la frontière entre terrain et bureau n'est pas un réglage de
                      permission mais un type de compte distinct ; ni role_canonique,
                      ni perimetre, ni les règles opérationnelles ne représentent une
                      partition de cette nature
    termes_source: ["compte chantier", "compte gestion"]
    preuve: {niveau: explicite, source: texte,
             citation: "Visualisation, Édition et Clôture  (compte gestion)"}
