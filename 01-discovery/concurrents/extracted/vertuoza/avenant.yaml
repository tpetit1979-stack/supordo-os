parcours:
  origine: inconnu
  nature: installation

interactions:
  - acteur:
      role_brut: null
      role_canonique: inconnu
      preuve: {niveau: inconnu, source: autre, citation: null}
    destinataire:
      role_brut: client
      role_canonique: client
      preuve: {niveau: explicite, source: texte,
               citation: "Ajoutez des remarques visibles pour le client"}
    perimetre: client
    relation: autre
    canal: inconnu
    dans_logiciel: oui
    mecanismes:
      - forme: visibilite
        preuve: {niveau: explicite, source: texte,
                 citation: "des remarques visibles pour le client, des remarques internes"}

transitions_objet:
  - objet_source: devis de base
    etat_entree: signé par le client
    action: cocher des lignes du devis de base pour les ajouter à l'avenant
    objet_resultat: avenant
    etat_sortie: null
    owner_avant: {role: inconnu, preuve: {niveau: inconnu, source: autre, citation: null}}
    owner_apres: {role: inconnu, preuve: {niveau: inconnu, source: autre, citation: null}}
    continuite:
      statut_observation: continue_documentee
      ruptures: []
    preuve: {niveau: explicite, source: texte,
             citation: "Cochez les lignes du devis de base pour les ajouter à l'Avenant."}

  - objet_source: fichier Excel
    etat_entree: null
    action: importer
    objet_resultat: avenant
    etat_sortie: null
    owner_avant: {role: inconnu, preuve: {niveau: inconnu, source: autre, citation: null}}
    owner_apres: {role: inconnu, preuve: {niveau: inconnu, source: autre, citation: null}}
    continuite:
      statut_observation: non_determinable
      ruptures: []
    preuve: {niveau: explicite, source: texte,
             citation: "Encodez votre Avenant (ou importez-le au format Excel)"}

  - objet_source: avenant
    etat_entree: accepté
    action: intégrer
    objet_resultat: état d'avancement et tableau de rentabilité
    etat_sortie: null
    owner_avant: {role: inconnu, preuve: {niveau: inconnu, source: autre, citation: null}}
    owner_apres: {role: inconnu, preuve: {niveau: inconnu, source: autre, citation: null}}
    continuite:
      statut_observation: continue_documentee
      ruptures: []
    preuve: {niveau: explicite, source: texte,
             citation: "ajoutant ou soustrayant son montant au devis de base"}

regles_operationnelles:
  - description_brute: un même avenant peut contenir des lignes positives et des lignes
                       négatives
    objet_concerne: avenant
    condition: null
    consequence: les quantités du devis initial peuvent être ajustées à la hausse
                 comme à la baisse dans un seul document
    preuve: {niveau: explicite, source: texte,
             citation: "peut contenir des lignes positives et/ou négatives"}
    resolution_documentee: null

  - description_brute: un avenant n'est repris dans les états d'avancement et la
                       rentabilité qu'une fois accepté
    objet_concerne: avenant
    condition: l'avenant est accepté
    consequence: il est intégré aux futurs états d'avancement et au tableau de rentabilité
    preuve: {niveau: explicite, source: texte,
             citation: "Une fois accepté, l'Avenant est intégré dans une zone spécifique"}
    resolution_documentee: null

  - description_brute: l'avenant précise le nombre de jours ouvrables supplémentaires
                       nécessaires
    objet_concerne: avenant
    condition: null
    consequence: le client peut prendre conscience de l'allongement du délai des travaux
    preuve: {niveau: explicite, source: texte,
             citation: "L'Avenant spécifie le nombre de jours ouvrables supplémentaires nécessaires"}
    resolution_documentee: null

signaux_emergents:
  - description_brute: le formulaire de création d'un avenant comporte un champ
                       « responsable », sans que l'article indique quel rôle il désigne
                       ni ce que cette désignation entraîne
    pourquoi_notable: un rôle est attaché nominativement à un document contractuel, mais
                      il n'est ni acteur ni destinataire d'une interaction documentée ;
                      le schéma n'a aucun emplacement pour un rôle porté par l'objet
                      lui-même
    termes_source: ["responsable"]
    preuve: {niveau: explicite, source: texte,
             citation: "(référence, responsable, jours ouvrables supplémentaires, taux de TVA"}
