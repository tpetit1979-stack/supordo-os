regles_operationnelles:
  - description_brute: la signature électronique n'est disponible qu'à partir du pack Pro+
    objet_concerne: signature électronique
    condition: pack Pro+
    consequence: la fonctionnalité est disponible
    preuve: {niveau: explicite, source: texte,
             citation: "disponible uniquement à partir du pack Pro+"}
    resolution_documentee: null

  - description_brute: sans la métadonnée [LINK_DEVIS] dans le modèle d'email, le client
                       ne peut pas consulter ni signer le devis en ligne
    objet_concerne: modèle d'email
    condition: métadonnée [LINK_DEVIS] présente dans le modèle
    consequence: le client peut consulter et signer le devis en ligne
    preuve: {niveau: explicite, source: texte,
             citation: "assurez-vous d'y inclure cette métadonnée pour permettre à vos clients"}
    resolution_documentee:
      action: insérer la métadonnée [LINK_DEVIS] dans le modèle d'email personnalisé
      acteur: null
      preuve: {niveau: explicite, source: texte,
               citation: "assurez-vous d'y inclure cette métadonnée"}

  - description_brute: un modèle PDF personnalisé doit contenir une zone de signature,
                       et une seule
    objet_concerne: modèle de document PDF
    condition: modèle personnalisé contenant exactement une zone de signature
    consequence: le processus de signature fonctionne correctement
    preuve: {niveau: explicite, source: texte,
             citation: "vérifiez qu'il contient bien une zone de signature (et une seule)"}
    resolution_documentee: null

  - description_brute: le modèle de document ne peut plus être choisi au moment de
                       l'envoi, le lien de signature étant identique pour un devis donné
    objet_concerne: modèle de document
    condition: envoi d'un devis en signature électronique
    consequence: le modèle appliqué est celui défini par défaut dans les paramètres
    preuve: {niveau: explicite, source: texte,
             citation: "Il n'est plus possible de définir un modèle lors de l'envoi par email"}
    resolution_documentee: null

signaux_emergents: []
