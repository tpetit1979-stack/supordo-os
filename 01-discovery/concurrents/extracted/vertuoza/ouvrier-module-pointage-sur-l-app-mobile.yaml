               citation: "permet aux chefs d'équipe de modifier et valider facilement le pointage"}
    destinataire:
      role_brut: gestionnaire ou secrétaire
      role_canonique: bureau
      preuve: {niveau: explicite, source: texte,
               citation: "clôturé par le gestionnaire ou la secrétaire sur ordinateur"}
    perimetre: interne
    relation: inconnu
    canal: statut
    dans_logiciel: oui
