transitions_objet:
  - objet_source: planning de chantier et d'intervention
    etat_entree: null
    action: génération automatique quotidienne
    objet_resultat: pointage
    etat_sortie: à valider
    owner_avant: {role: inconnu, preuve: {niveau: inconnu, source: autre, citation: null}}
    owner_apres:
      role: chef d'équipe
      preuve: {niveau: contextuel, source: texte,
               citation: "le chef d’équipe n’a qu’à les valider"}
    continuite:
      statut_observation: continue_documentee
      ruptures: []
    preuve: {niveau: explicite, source: texte,
             citation: "généré chaque jour, pour chaque ouvrier en fonction du planning"}

  - objet_source: pointage
    etat_entree: à valider
    action: valider
    objet_resultat: pointage
    etat_sortie: validé
    owner_avant:
      role: chef d'équipe
      preuve: {niveau: explicite, source: texte,
               citation: "le chef d’équipe n’a qu’à les valider"}
    owner_apres:
      role: gestionnaire ou secrétaire
      preuve: {niveau: explicite, source: texte,
               citation: "Le pointage validé sera ensuite clôturé par le gestionnaire"}
    continuite:
      statut_observation: continue_documentee
      ruptures: []
    preuve: {niveau: explicite, source: texte,
             citation: "Le pointage validé sera ensuite clôturé par le gestionnaire ou la secrétaire"}

  - objet_source: pointage
    etat_entree: validé
    action: clôturer puis exporter
    objet_resultat: export pour le secrétariat social
    etat_sortie: clôturé
    owner_avant:
      role: gestionnaire ou secrétaire
      preuve: {niveau: explicite, source: texte,
               citation: "clôturé par le gestionnaire ou la secrétaire sur ordinateur"}
    owner_apres: {role: inconnu, preuve: {niveau: inconnu, source: autre, citation: null}}
    continuite:
      statut_observation: rupture_documentee
      ruptures:
        - type: sortie_logiciel
          preuve: {niveau: explicite, source: texte,
                   citation: "pouvant être exporté pour le secrétariat social"}
    preuve: {niveau: explicite, source: texte,
             citation: "influençant ainsi la rentabilité des chantiers et pouvant être exporté"}

regles_operationnelles:
  - description_brute: le module de pointage n'apparaît pas tant qu'un admin ne l'a pas
                       activé dans les paramètres sur ordinateur
    objet_concerne: module pointage
    condition: module activé dans Paramètres > Propriétés > Pointage > Préférences
    consequence: l'icône Pointage est visible dans l'application mobile
    preuve: {niveau: explicite, source: texte,
             citation: "Le module doit être activé par un admin sur ordinateur"}
    resolution_documentee:
      action: faire activer le module dans les paramètres sur ordinateur
      acteur: admin
      preuve: {niveau: explicite, source: texte,
               citation: "Si vous ne le voyez pas, vérifier le prérequis"}

  - description_brute: les heures supplémentaires sont calculées d'après l'horaire
                       renseigné sur la fiche ouvrier
    objet_concerne: pointage
    condition: horaire renseigné sur la fiche ouvrier
    consequence: les heures supplémentaires sont déterminées
    preuve: {niveau: explicite, source: texte,
             citation: "définies en fonction de l'horaire indiquée sur la fiche ouvrier"}
    resolution_documentee: null

  - description_brute: les motifs d'absence proposés au chef d'équipe sont ceux définis
                       par l'administrateur
    objet_concerne: motif d'absence
    condition: motifs définis dans Propriétés > Planning > Types d'absences
    consequence: les motifs sont sélectionnables lors de la déclaration d'absence
    preuve: {niveau: explicite, source: texte,
             citation: "Les motifs d’absence sont définis par l’administrateur dans les paramètres"}
    resolution_documentee: null

  - description_brute: un pointage validé peut être rouvert
    objet_concerne: pointage
    condition: pointage validé
    consequence: l'icône se transforme en flèche permettant de rouvrir le pointage
    preuve: {niveau: explicite, source: texte,
             citation: "permettant de rouvrir le pointage si nécessaire"}
    resolution_documentee:
      action: cliquer sur la flèche pour rouvrir le pointage
      acteur: chef d'équipe
      preuve: {niveau: contextuel, source: texte,
               citation: "L’icône se transformera en flèche"}

  - description_brute: les informations de mobilité concernent la paie en Belgique et
                       peuvent être désactivées
    objet_concerne: mobilité
    condition: fonctionnalité de mobilité activée
    consequence: kilomètres et rôle chauffeur / passager peuvent être saisis
    preuve: {niveau: explicite, source: texte,
             citation: "Ces informations sont importantes pour la paie en Belgique."}
    resolution_documentee:
      action: désactiver la fonctionnalité si elle ne concerne pas l'entreprise
      acteur: administrateur
      preuve: {niveau: explicite, source: texte,
               citation: "elle peut être désactivée par l’administrateur"}

  - description_brute: par défaut le chef d'équipe ne voit que les ouvriers planifiés
                       sur les chantiers où il est lui-même assigné
    objet_concerne: liste des ouvriers
    condition: aucune modification de la liste
    consequence: seuls les ouvriers des chantiers d'assignation sont affichés
    preuve: {niveau: explicite, source: texte,
             citation: "vous verrez les ouvriers planifiés sur les chantiers où vous êtes assigné"}
    resolution_documentee:
      action: modifier la liste via « Modifier les ouvriers »
      acteur: chef d'équipe
      preuve: {niveau: explicite, source: texte,
               citation: "Vous pouvez modifier cette liste en cliquant sur « Modifier les ouvriers »"}

signaux_emergents:
  - description_brute: l'éditeur présente le module en nommant les pratiques qu'il vient
                       remplacer — envoi d'informations sur WhatsApp, notes écrites sur
                       une feuille de papier
    pourquoi_notable: la documentation décrit un état antérieur du travail hors logiciel,
                      qui n'est ni une sortie actuelle du produit ni une rupture observée ;
                      aucun champ ne distingue une pratique remplacée d'une pratique en cours
    termes_source: ["Whatsapp", "feuille de papier"]
    preuve: {niveau: explicite, source: texte,
             citation: "Adieu les informations envoyées sur Whatsapp ou écrite sur une feuille de papier."}

  - description_brute: une entrée de type « AUTRE » permet de pointer du temps qui n'est
                       rattaché à aucun chantier ni intervention, par exemple une visite
                       au contrôle technique du véhicule
    pourquoi_notable: du temps de travail réel existe sans objet métier porteur ; les
                      transitions du schéma supposent toujours un objet source et un objet
                      résultat, et ne peuvent pas représenter une activité orpheline
    termes_source: ["AUTRE", "contrôle technique du véhicule"]
    preuve: {niveau: explicite, source: texte,
             citation: "pour des tâches non liées aux chantiers ou interventions"}
