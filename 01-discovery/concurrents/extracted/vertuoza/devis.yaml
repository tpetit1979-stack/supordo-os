regles_operationnelles:
  - description_brute: l'import d'un devis depuis Excel n'est proposé que si l'option
                       a été activée dans les paramètres
    objet_concerne: devis
    condition: option Import Excel activée dans Paramètres > Propriétés > Devis et avenant
    consequence: le bouton d'import depuis Excel est disponible
    preuve: {niveau: explicite, source: texte,
             citation: "Si l'option est activée dans les Paramètres"}
    resolution_documentee: null

  - description_brute: le devis reste entièrement modifiable tant qu'il n'a pas été
                       accepté ou refusé
    objet_concerne: devis
    condition: statut Draft, A envoyer ou Envoyé
    consequence: le devis est encore complètement éditable
    preuve: {niveau: explicite, source: texte,
             citation: "Durant ces trois statuts, le devis est encore complètement éditable."}
    resolution_documentee: null

  - description_brute: un devis refusé disparaît de la liste par défaut mais reste
                       présent dans l'application
    objet_concerne: devis
    condition: statut Refusé
    consequence: le devis disparaît de la liste filtrée par défaut
    preuve: {niveau: explicite, source: texte,
             citation: "il disparait de la liste qui est filtré par défaut"}
    resolution_documentee: null

  - description_brute: le nombre de types de lignes disponibles dépend du pack souscrit
    objet_concerne: ligne de devis
    condition: pack PRO / PRO+ ou pack Expert
    consequence: 5 types de lignes, ou 9 à partir du pack Expert
    preuve: {niveau: explicite, source: texte,
             citation: "de 5 types (pour les PRO et PRO+), ou de 9 types"}
    resolution_documentee: null

  - description_brute: le calcul de marge n'est cohérent que si un prix d'achat est
                       renseigné dans tous les composants
    objet_concerne: tableau de résumé des marges
    condition: prix d'achat renseigné dans tous les composants
    consequence: le résultat de marge est cohérent
    preuve: {niveau: explicite, source: texte,
             citation: "vous devez indiquer un prix d'achat dans tous vos composants"}
    resolution_documentee: null

signaux_emergents:
  - description_brute: la quantité d'un poste peut être calculée à partir du détail
                       des mesures relevées, et ce détail peut être affiché ou masqué
                       sur le document remis au client
    pourquoi_notable: le relevé métré est conservé à l'intérieur de la ligne de devis
                      au lieu d'être réduit à un total, et son exposition au client
                      est un choix ; ni les interactions, ni les transitions, ni les
                      règles ne représentent cette conservation d'un raisonnement de
                      chiffrage
    termes_source: ["Quantité avancée", "template de devis"]
    preuve: {niveau: explicite, source: texte,
             citation: "calculer plus précisément la quantité du poste en fonction des mesures"}
